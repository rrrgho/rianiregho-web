# Apache reverse proxy for the rianiregho-web container (listens on 127.0.0.1:8021).
#
# Install:
#   sudo cp deploy/apache-rianiregho.conf /etc/apache2/sites-available/rianiregho-web.conf
#   sudo a2enmod proxy proxy_http headers rewrite ssl
#   sudo a2ensite rianiregho-web && sudo apache2ctl configtest && sudo systemctl reload apache2
#   sudo certbot --apache -d rianiregho.com -d www.rianiregho.com   # adds the :443 vhost + redirect
#
# certbot copies the directives below into the HTTPS vhost it creates, so the
# X-Forwarded-Proto expression resolves to "https" there.

<VirtualHost *:80>
    ServerName rianiregho.com
    ServerAlias www.rianiregho.com

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        / http://127.0.0.1:8021/ timeout=300
    ProxyPassReverse / http://127.0.0.1:8021/

    # Tell Next.js/NextAuth which protocol the visitor used (http here, https after certbot).
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}

    # Photo uploads can be large: no body-size cap at the proxy (the app enforces 8 MB per photo).
    LimitRequestBody 0

    ErrorLog  ${APACHE_LOG_DIR}/rianiregho-web-error.log
    CustomLog ${APACHE_LOG_DIR}/rianiregho-web-access.log combined
</VirtualHost>
